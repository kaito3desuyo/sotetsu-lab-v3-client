name: Deploy on push version tags
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      stage:
        description: デプロイ先の stage
        type: choice
        options:
          - prod
          - stg
        default: prod
      ssr:
        description: SSR の入り切り（on は Lambda で描く・off は CSR のシェルを返す）
        type: choice
        options:
          - 'on'
          - 'off'
        default: 'on'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 同じ stage のデプロイを重ねない（待たせて、途中のものは止めない）
    concurrency:
      group: deploy-${{ inputs.stage || 'prod' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install npm package
        run: npm ci --force

      - name: Build application
        run: npm run build:prod -- --output-path=./dist/build-by-ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync hashed files before deploy
        # osls deploy から後の sync までの間に Lambda が描いた新しい HTML が、まだ S3 に無いチャンクを読んで真っ白になるのを防ぐ。
        # 名前にハッシュの付くファイルだけを先に置く（下の 1 回目の sync と同じ include・cache-control・--delete なし）。
        # スタックがまだ無い（初回の stg）ときは何もしないで進む。
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name "sotetsu-lab-v3-$STAGE-client-cfstack" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" --output text 2>/dev/null || true)"
          if [ -z "$bucket" ] || [ "$bucket" = "None" ]; then
            echo "スタックまたは WebBucketName が無いので、先行 sync を飛ばす"
            exit 0
          fi
          aws s3 sync ./dist/build-by-ci/browser "s3://$bucket" --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "chunk-*.js" --include "main-*.js" --include "polyfills-*.js" --include "styles-*.css" --include "media/*"

      - name: Deploy AWS resources
        # タグの push では inputs が空なので prod・on になる。
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
          SSR: ${{ inputs.ssr || 'on' }}
        run: npx osls deploy --stage "$STAGE" --param="ssr=$SSR"

      - name: Deploy and create invalidation
        # 名前にハッシュの付くファイルだけ 1 年置き、index.csr.html・ngsw*.json・assets/ などは毎回確かめさせる。
        # 全部 1 年にすると、Service Worker の無いブラウザが古い index.csr.html を使い続ける。
        # ハッシュ付きの 1 回目は --delete しない（入れ替え中も、開いたままのタブが古いハッシュのファイルを読めるように）。
        # 2 回目は除外したファイルを消さないので、古いハッシュのファイルは残る。
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name sotetsu-lab-v3-$STAGE-client-cfstack \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          deploy() {
            aws s3 sync ./dist/build-by-ci/browser "s3://$1" --cache-control "public, max-age=31536000, immutable" \
              --exclude "*" --include "chunk-*.js" --include "main-*.js" --include "polyfills-*.js" --include "styles-*.css" --include "media/*"
            aws s3 sync ./dist/build-by-ci/browser "s3://$1" --delete --cache-control "no-cache" \
              --exclude "chunk-*.js" --exclude "main-*.js" --exclude "polyfills-*.js" --exclude "styles-*.css" --exclude "media/*"
            aws cloudfront create-invalidation --distribution-id "$2" --paths '/*'
          }
          deploy "$(output WebBucketName)" "$(output WebDistributionId)"
