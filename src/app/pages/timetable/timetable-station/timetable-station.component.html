@if (isLoading()) {
    <div class="tw-fixed tw-left-0 tw-top-[48px] tw-w-full md:tw-top-[64px]">
        <mat-progress-bar
            color="accent"
            mode="indeterminate"
        ></mat-progress-bar>
    </div>
}

<main class="tw-flex tw-flex-col tw-gap-4 tw-p-4 max-sm:tw-px-2 md:tw-p-16">
    <header
        class="tw-sticky tw-top-0 tw-z-10 tw-flex tw-flex-row tw-flex-wrap tw-items-center tw-justify-between tw-gap-4 tw-bg-grey-50 tw-py-2"
    >
        <h2 class="mat-h2 !tw-m-0">駅別時刻表</h2>

        <mat-button-toggle-group
            [value]="tripDirection()"
            (change)="onDirectionChange($event.value)"
            aria-label="上り・下り切替"
        >
            <mat-button-toggle [value]="tripDirectionEnum.INBOUND">
                {{ tripDirectionLabel.get(tripDirectionEnum.INBOUND) }}
            </mat-button-toggle>
            <mat-button-toggle [value]="tripDirectionEnum.OUTBOUND">
                {{ tripDirectionLabel.get(tripDirectionEnum.OUTBOUND) }}
            </mat-button-toggle>
        </mat-button-toggle-group>
    </header>

    <div>
        @if (isEmpty()) {
            <app-empty-state
                icon="train"
                message="この駅の時刻データはありません"
            ></app-empty-state>
        } @else if (calendar()) {
            <app-timetable-station-table
                [showCurrentFormation]="isTodaysCalendar()"
            ></app-timetable-station-table>
        }
    </div>

    <ng-adsense [adSlot]="6036265169"></ng-adsense>

    <app-timetable-search-card-c></app-timetable-search-card-c>
</main>
