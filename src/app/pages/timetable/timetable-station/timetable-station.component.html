@if (isLoading()) {
    <div class="tw-fixed tw-left-0 tw-top-[48px] tw-w-full md:tw-top-[64px]">
        <mat-progress-bar
            color="accent"
            mode="indeterminate"
        ></mat-progress-bar>
    </div>
}

<main class="tw-flex tw-flex-col tw-gap-4 tw-p-4 max-sm:tw-px-2 md:tw-p-16">
    <header
        class="tw-sticky tw-top-0 tw-z-10 tw-flex tw-w-full tw-flex-col tw-gap-3 tw-bg-grey-50 tw-py-2"
    >
        <!-- G0-5: ページ名はヘッダー（layout header の pageTitle）のみに表示し、
             本文の h1/h2 重複は置かない -->
        <!-- G1: 駅/ダイヤの select は横並び配置（mockup-01） -->
        <div class="tw-flex tw-flex-row tw-flex-wrap tw-items-center tw-gap-2">
            <mat-form-field class="tw-w-32">
                <mat-label>駅</mat-label>
                <mat-select
                    [value]="stationId()"
                    (valueChange)="onStationChange($event)"
                >
                    @for (station of stationOptions(); track station.stationId) {
                        <mat-option [value]="station.stationId">
                            {{ station.stationName }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>
            <mat-form-field class="tw-w-40">
                <mat-label>ダイヤ</mat-label>
                <mat-select
                    [value]="calendarId()"
                    (valueChange)="onCalendarChange($event)"
                >
                    @for (calendar of calendars(); track calendar.calendarId) {
                        <mat-option [value]="calendar.calendarId">
                            {{ calendar.calendarName }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>

        <!-- G0-3/G1: 上り/下りは全幅2セグメントトグル（shared/segment-toggle） -->
        <app-segment-toggle
            [options]="tripDirectionOptions"
            [value]="tripDirection()"
            (valueChange)="onDirectionChange($event)"
        ></app-segment-toggle>
    </header>

    <div>
        @if (isEmpty()) {
            <!-- G12: mockup-07 準拠の3点セット（アイコン+説明+次アクション）。
                 次アクションは反対方向への切り替え（ダイヤ/方向を変えて再検索する動線）。 -->
            <app-empty-state
                icon="train"
                message="この条件の列車情報はありません"
                subtitle="ダイヤまたは方向を変えてお試しください。"
                [actionLabel]="oppositeDirectionActionLabel()"
                (actionClick)="onDirectionChange(oppositeDirection())"
            ></app-empty-state>
        } @else if (calendar()) {
            <app-timetable-station-table
                [showCurrentFormation]="isTodaysCalendar()"
            ></app-timetable-station-table>
        }
    </div>

    <ng-adsense [adSlot]="6036265169"></ng-adsense>

    <app-timetable-search-card-c></app-timetable-search-card-c>
</main>
