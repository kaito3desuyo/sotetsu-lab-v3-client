@if (isLoading() && !notFound()) {
    <div
        class="tw-fixed tw-left-0 tw-top-[48px] tw-z-[60] tw-w-full md:tw-top-[64px]"
    >
        <mat-progress-bar
            aria-label="読み込み中"
            color="accent"
            mode="indeterminate"
        ></mat-progress-bar>
    </div>
}

<main
    class="tw-flex tw-flex-col tw-gap-4 tw-p-4 md:tw-p-6 lg:tw-p-8 xl:tw-p-16"
>
    <app-control-band [summary]="bandSummary()">
        <app-timetable-operation-controls
            [operationNumber]="operationNumber()"
            [operationNumbers]="operationNumbers()"
            [viewKind]="viewKind()"
            [date]="date()"
            [maxDate]="today()"
            [calendars]="calendars()"
            [calendarId]="urlCalendarId() ?? calendarId() ?? null"
            (operationNumberChange)="onOperationNumberChange($event)"
            (dateChange)="onDateChange($event)"
            (shift)="onShift($event)"
            (calendarChange)="onCalendarChange($event)"
            (viewByCalendar)="onViewByCalendar()"
        ></app-timetable-operation-controls>
    </app-control-band>

    @if (notFound()) {
        <app-not-found-content></app-not-found-content>
    } @else {
        @if (showHeader()) {
            <app-timetable-operation-header
                [operationNumber]="operationNumber() ?? ''"
                [operationId]="operationId()"
                [calendarLabel]="calendarLabel()"
                [viewKind]="viewKind()"
                [date]="date()"
                [currentFormationNumber]="currentFormationNumber()"
                [currentInferred]="currentInferred()"
                [sightings]="sightings()"
                [position]="position()"
                [positionStations]="stations()"
                [positionTripClasses]="tripClasses()"
                [calendarId]="calendarId()"
            ></app-timetable-operation-header>
        }

        @switch (view()) {
            @case ('noNumber') {
                <app-empty-state
                    icon="train"
                    message="運用番号を選択してください"
                    actionLabel="運用番号を選択する"
                    (actionClick)="band().open.set(true)"
                ></app-empty-state>
            }
            @case ('error') {
                <app-empty-state
                    icon="error_outline"
                    headingLevel="h2"
                    message="読み込めませんでした"
                    subtitle="通信の状態を確かめて、もう一度お試しください。"
                    actionLabel="再読み込み"
                    (actionClick)="reload()"
                ></app-empty-state>
            }
            @case ('noCalendar') {
                <app-empty-state
                    icon="info"
                    [message]="
                        date()
                            ? 'この日のダイヤはありません'
                            : 'ダイヤが見つかりません'
                    "
                ></app-empty-state>
            }
            @case ('noOperation') {
                <app-empty-state
                    icon="info"
                    data-testid="no-operation"
                    [message]="
                        (date() ? 'この日のダイヤに ' : 'このダイヤに ') +
                        operationNumber() +
                        ' 運用はありません'
                    "
                ></app-empty-state>
            }
            @case ('noTrips') {
                <app-empty-state
                    icon="info"
                    message="この運用に列車はありません"
                ></app-empty-state>
            }
            @case ('trips') {
                <app-timetable-operation-trip-list
                    [rows]="rows()"
                    [states]="progress().states"
                    [stationNames]="stationNames()"
                    [calendarId]="calendarId()"
                    [date]="date()"
                ></app-timetable-operation-trip-list>
            }
        }
    }
</main>
