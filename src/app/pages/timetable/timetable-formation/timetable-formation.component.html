@if (isLoading()) {
    <div
        class="tw-fixed tw-left-0 tw-top-[48px] tw-z-[60] tw-w-full md:tw-top-[64px]"
    >
        <mat-progress-bar
            color="accent"
            mode="indeterminate"
        ></mat-progress-bar>
    </div>
}

<main
    class="tw-flex tw-flex-col tw-gap-4 tw-p-4 md:tw-p-6 lg:tw-p-8 xl:tw-p-16"
>
    <app-timetable-formation-header
        [formationNumber]="formationNumber()"
        [formation]="view() === 'loading' ? null : storeFormation()"
        [annotation]="annotation()"
        [sightings]="sightings()"
        [currentOperationNumber]="currentOperationNumber()"
        [currentBasisLabel]="currentBasisLabel()"
        [currentInferred]="currentInferred()"
        [position]="position()"
        [positionStations]="stations()"
        [positionTripClasses]="tripClasses()"
        [positionLinks]="links()"
        [calendarId]="calendarId()"
        [tomorrowOperationNumber]="tomorrowOperationNumber()"
        [tomorrowBlocked]="tomorrowBlocked()"
        [stationGroups]="stationGroups()"
        [selectedStationId]="selectedStationId()"
        [selectedStationName]="selectedStationName()"
        [date]="date()"
        [dateKind]="dateKind()"
        [maxDate]="maxDate()"
        [canGoNext]="canGoNext()"
        (formationNumberSubmit)="onFormationSubmit($event)"
        (stationChange)="onStationChange($event)"
        (dateChange)="onDateChange($event)"
        (shift)="onShift($event)"
    ></app-timetable-formation-header>

    @switch (view()) {
        @case ('error') {
            <app-empty-state
                icon="error_outline"
                message="読み込めませんでした"
                subtitle="通信の状態を確かめて、もう一度お試しください。"
                actionLabel="再読み込み"
                (actionClick)="reload()"
            ></app-empty-state>
        }
        @case ('notFound') {
            <app-empty-state
                icon="info"
                [message]="
                    formationNumber() + ' はこの日に有効な編成にありません'
                "
            ></app-empty-state>
        }
        @case ('noCalendar') {
            <app-empty-state
                icon="info"
                message="この日のダイヤはありません"
            ></app-empty-state>
        }
        @case ('noSighting') {
            <app-empty-state
                icon="info"
                message="この日の目撃はありません"
            ></app-empty-state>
        }
        @case ('station') {
            <app-timetable-formation-station-list
                [summary]="stationSummary()"
                [stationName]="selectedStationName() ?? ''"
                [stationNames]="stationNames()"
                [calendarId]="calendarId()"
                [dateKind]="dateKind()"
            ></app-timetable-formation-station-list>
        }
        @case ('trips') {
            <app-timetable-formation-trip-list
                [rows]="rows()"
                [states]="progress().states"
                [stationNames]="stationNames()"
                [calendarId]="calendarId()"
                (postRequested)="onPostRequested($event)"
            ></app-timetable-formation-trip-list>
        }
    }
</main>
