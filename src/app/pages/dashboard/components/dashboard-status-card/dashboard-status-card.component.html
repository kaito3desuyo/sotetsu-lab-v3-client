<section class="tw-flex tw-flex-col tw-gap-3 tw-bg-white tw-p-4 tw-shadow-md">
    <div
        class="tw-flex tw-flex-row tw-items-start tw-justify-between tw-gap-4"
    >
        <div class="tw-flex tw-flex-col tw-gap-1">
            <span class="tw-text-xs tw-text-grey-600">
                {{ businessDateLabel() }}
            </span>
            <span class="tw-text-lg tw-font-bold tw-text-primary-500">
                {{ todaysCalendar()?.calendarName ?? '読み込み中...' }}
            </span>
        </div>
        <span class="tw-text-4xl tw-tabular-nums tw-text-primary-500">
            {{ clockLabel() }}
        </span>
    </div>

    <div class="tw-grid tw-grid-cols-2 tw-gap-3">
        <div
            class="tw-flex tw-flex-col tw-items-center tw-gap-1 tw-rounded tw-bg-grey-100 tw-p-3"
        >
            <span class="tw-tabular-nums tw-text-3xl tw-font-bold">
                {{ runningTripCount() }}
            </span>
            <span class="tw-text-xs tw-text-grey-600">
                走行中の列車（計画）
            </span>
        </div>
        <div
            class="tw-flex tw-flex-col tw-items-center tw-gap-1 tw-rounded tw-bg-grey-100 tw-p-3"
        >
            <span class="tw-tabular-nums tw-text-3xl tw-font-bold">
                {{ sightingCountToday() }}
            </span>
            <span class="tw-text-xs tw-text-grey-600">本日の目撃投稿</span>
        </div>
    </div>
</section>
