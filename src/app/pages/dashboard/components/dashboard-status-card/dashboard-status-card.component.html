<section
    class="tw-relative tw-flex tw-flex-col tw-gap-3 tw-overflow-hidden tw-bg-white tw-p-4 tw-shadow-md"
>
    <!-- ミニダイヤグラム背景（mockup-11）: ±30分の実データ走行線を紺8%で敷き、中央に現在時刻の赤線。装飾のため aria-hidden。 -->
    <svg
        class="tw-pointer-events-none tw-absolute tw-inset-0 tw-h-full tw-w-full"
        [attr.viewBox]="miniDiagramViewBox"
        preserveAspectRatio="none"
        aria-hidden="true"
    >
        @for (line of miniDiagramLines(); track $index) {
            <line
                [attr.x1]="line.x1"
                [attr.y1]="line.y1"
                [attr.x2]="line.x2"
                [attr.y2]="line.y2"
                stroke="#001556"
                stroke-width="1"
                stroke-opacity="0.08"
            ></line>
        }
        <line
            [attr.x1]="miniDiagramNowX"
            y1="0"
            [attr.x2]="miniDiagramNowX"
            [attr.y2]="miniDiagramViewH"
            stroke="#d9534f"
            stroke-width="1"
            stroke-opacity="0.5"
        ></line>
    </svg>

    <div
        class="tw-relative tw-flex tw-flex-row tw-items-start tw-justify-between tw-gap-4"
    >
        <div class="tw-flex tw-flex-col tw-gap-1">
            <span class="tw-text-xs tw-text-grey-600">
                {{ businessDateLabel() }}
            </span>
            <div class="tw-flex tw-flex-row tw-flex-wrap tw-items-baseline tw-gap-2">
                <span class="tw-text-lg tw-font-bold tw-text-primary-500">
                    {{ todaysCalendar()?.calendarName ?? '読み込み中...' }}
                </span>
                @if (revisionLabel()) {
                    <span class="tw-text-xs tw-text-grey-600">
                        {{ revisionLabel() }}
                    </span>
                }
            </div>
        </div>
        <span class="tw-text-4xl tw-tabular-nums tw-text-primary-500">
            {{ clockLabel() }}
        </span>
    </div>

    <div class="tw-relative tw-grid tw-grid-cols-2 tw-gap-3">
        <div
            class="tw-flex tw-flex-col tw-items-center tw-gap-1 tw-rounded tw-bg-grey-100 tw-p-3"
        >
<!-- データ確定前は「—」を表示して偽の 0 と区別する -->
            <span class="tw-tabular-nums tw-text-3xl tw-font-bold">
                {{ isLoading() ? '—' : runningTripCount() }}
            </span>
            <span class="tw-text-xs tw-text-grey-600">
                走行中の列車（計画）
            </span>
        </div>
        <div
            class="tw-flex tw-flex-col tw-items-center tw-gap-1 tw-rounded tw-bg-grey-100 tw-p-3"
        >
            <span class="tw-tabular-nums tw-text-3xl tw-font-bold">
                {{ isLoading() ? '—' : sightingCountToday() }}
            </span>
            <span class="tw-text-xs tw-text-grey-600">本日の目撃投稿</span>
        </div>
    </div>
</section>
