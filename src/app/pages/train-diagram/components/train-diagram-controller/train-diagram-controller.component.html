<app-collapsible-panel
    class="tw-sticky tw-top-0 tw-z-20"
    label="表示設定"
    [summary]="collapsedSummary()"
>
    <!-- ダイヤ select + 時間帯 select を横並びに（G0-1/G0-7・G7）。tw-w-full だと flex-wrap で
         モバイル幅で縦積みになってしまうため、tw-flex-1 で常に同一行に収める。 -->
    <div class="tw-flex tw-flex-row tw-gap-2">
        <mat-form-field subscriptSizing="dynamic" class="tw-min-w-0 tw-flex-[3]">
            <mat-label>ダイヤ</mat-label>
            <mat-select
                [value]="calendarId()"
                (selectionChange)="onCalendarChange($event.value)"
            >
                @for (calendar of calendars(); track calendar.calendarId) {
                    <mat-option [value]="calendar.calendarId">
                        {{ calendarSummaryLabel(calendar) }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field subscriptSizing="dynamic" class="tw-min-w-0 tw-flex-[2]">
            <mat-label>時間帯</mat-label>
            <mat-select
                [value]="currentWindowValue()"
                (selectionChange)="onWindowChange($event.value)"
            >
                @for (option of windowOptions; track option.value) {
                    <mat-option [value]="option.value">
                        {{ option.label }}
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>
    </div>

    <div class="tw-flex tw-flex-row tw-flex-wrap tw-gap-3">
        <mat-button-toggle-group
            class="tw-self-center"
            [value]="directionFilter()"
            (change)="onDirectionFilterChange($event.value)"
            aria-label="方向"
        >
            <mat-button-toggle value="up">上り</mat-button-toggle>
            <mat-button-toggle value="down">下り</mat-button-toggle>
            <mat-button-toggle value="both">両方</mat-button-toggle>
        </mat-button-toggle-group>

        <mat-button-toggle-group
            class="tw-self-center"
            [value]="zoomLevel()"
            (change)="onZoomChange($event.value)"
            aria-label="時間軸ズーム"
        >
            <mat-button-toggle value="narrow">縮小</mat-button-toggle>
            <mat-button-toggle value="standard">標準</mat-button-toggle>
            <mat-button-toggle value="wide">拡大</mat-button-toggle>
        </mat-button-toggle-group>
    </div>

    <div>
        <p class="tw-m-0 tw-mb-1 tw-text-xs tw-text-grey-600">
            路線（複数選択）
        </p>
        <app-filter-chips
            mode="multiple"
            [options]="routeOptions()"
            [selected]="selectedRouteIds()"
            (selectedChange)="onRouteChange($event)"
        ></app-filter-chips>
    </div>
</app-collapsible-panel>
