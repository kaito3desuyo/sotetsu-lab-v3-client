<div
    class="tw-grid tw-grid-cols-[repeat(auto-fill,minmax(7rem,1fr))] tw-gap-x-3 tw-gap-y-1 tw-border-b tw-border-grey-200 tw-bg-white tw-px-3 tw-py-2 tw-text-xs"
>
    @for (entry of legendEntries(); track entry.color) {
        <span class="tw-flex tw-min-w-0 tw-items-center tw-gap-1.5">
            <!-- スウォッチは 2px×16px では色を判別しづらかったため 4px×24px にする（audit M3） -->
            <span
                class="tw-inline-block tw-h-1 tw-w-6 tw-shrink-0 tw-rounded-sm"
                [style.background-color]="entry.color"
            ></span>
            <span class="tw-truncate">{{ entry.labels.join('・') }}</span>
        </span>
    }
    @if (showCurrentTimeCursor()) {
        <span class="tw-flex tw-min-w-0 tw-items-center tw-gap-1.5">
            <span
                class="tw-inline-block tw-h-1 tw-w-6 tw-shrink-0 tw-rounded-sm"
                style="background-color: rgb(217, 83, 79)"
            ></span>
            <span class="tw-truncate">現在時刻</span>
        </span>
    }
</div>
