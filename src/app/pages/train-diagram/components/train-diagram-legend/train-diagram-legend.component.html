<div class="tw-flex tw-flex-row tw-flex-wrap tw-items-center tw-gap-3 tw-border-b tw-border-grey-200 tw-bg-white tw-px-3 tw-py-2 tw-text-xs">
    @for (entry of legendEntries(); track entry.label) {
        <span class="tw-flex tw-items-center tw-gap-1">
            <span
                class="tw-inline-block tw-h-0.5 tw-w-4"
                [style.background-color]="entry.color"
            ></span>
            {{ entry.label }}
        </span>
    }
    @if (showCurrentTimeCursor()) {
        <span class="tw-flex tw-items-center tw-gap-1">
            <span
                class="tw-inline-block tw-h-0.5 tw-w-4"
                style="background-color: rgb(217, 83, 79)"
            ></span>
            現在時刻
        </span>
    }
</div>
