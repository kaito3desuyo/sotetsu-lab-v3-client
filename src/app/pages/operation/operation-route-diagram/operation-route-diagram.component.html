@if (isLoading()) {
    <div
        class="tw-fixed tw-left-0 tw-top-[48px] tw-z-[60] tw-w-full md:tw-top-[64px]"
    >
        <mat-progress-bar
            color="accent"
            mode="indeterminate"
        ></mat-progress-bar>
    </div>
}

<main
    class="tw-flex tw-flex-col tw-gap-4 tw-p-4 md:tw-p-6 lg:tw-p-8 xl:tw-p-16"
>
    <!-- ページ名はヘッダー（layout header の pageTitle）だけに出し、本文に重ねない -->
    <!-- 操作帯（sticky）を div で包まない。包むと貼り付く範囲がその div の高さまでになり、
         スクロールすると帯ごと流れていく -->
    <app-operation-route-diagram-route-filter></app-operation-route-diagram-route-filter>
    <!-- 運用番号を選ぶ手段（検索カード）を広告より前に置く。
         運用番号が未設定のとき、「運用番号を設定して検索してください」という空状態と
         実際に設定できるコントロールの間に 280px の広告が挟まっており、
         このページ上で操作できること自体が見えなかった（audit C6）。 -->
    <div class="tw-flex tw-flex-col tw-gap-4">
        <div>
            @if (isAwaitingOperationTrips()) {
                <!-- 取る前は図と同じ白地に、ダイヤの帯（48px）と図の場所を画面 1 枚分取る。
                     以前は路線の絞り込みの行が後から出て図を押し下げていた（CLS 0.89・2026-10-22） -->
                <div
                    class="tw-flex tw-h-[calc(100dvh-48px)] tw-flex-col tw-overflow-hidden tw-rounded-card tw-bg-white md:tw-h-[calc(100dvh-64px)]"
                    aria-label="読み込み中"
                    data-testid="route-diagram-skeleton"
                >
                    <app-skeleton-bar
                        class="tw-h-12 tw-w-full tw-shrink-0 tw-rounded-none"
                    ></app-skeleton-bar>
                    <div class="tw-flex tw-flex-row tw-gap-6 tw-p-4">
                        @for (column of skeletonStationColumns; track column) {
                            <app-skeleton-bar
                                class="tw-h-16 tw-w-4"
                            ></app-skeleton-bar>
                        }
                    </div>
                    <div class="tw-flex tw-flex-col tw-gap-10 tw-px-4">
                        @for (row of skeletonTripRows; track row) {
                            <app-skeleton-bar
                                class="tw-h-3 tw-w-3/4"
                            ></app-skeleton-bar>
                        }
                    </div>
                </div>
            } @else if (drawingDisplayed()) {
                <app-operation-route-diagram-drawing
                    [stations]="stations()"
                    [tripOperationLists]="tripOperationLists()"
                    [calendar]="calendar()"
                    [operation]="operation()"
                    [linkLabels]="linkLabels()"
                    [itineraryLinks]="itineraryLinks()"
                    (clickNavigateTimetable)="onClickNavigateTimetable($event)"
                ></app-operation-route-diagram-drawing>
            } @else {
                <!-- G12: mockup-07 準拠の3点セット（アイコン+説明+次アクション）。 -->
                <app-empty-state
                    icon="route"
                    message="運用番号を設定して検索してください"
                    actionLabel="運用表を見る"
                    (actionClick)="onEmptyStateActionClick()"
                ></app-empty-state>
            }
        </div>
        <app-operation-search-card
            [calendarId]="searchCalendarId()"
            [operationId]="searchOperationId()"
        ></app-operation-search-card>
    </div>
</main>
