@if (isLoading()) {
    <div class="tw-fixed tw-left-0 tw-top-[48px] tw-w-full md:tw-top-[64px]">
        <mat-progress-bar
            color="accent"
            mode="indeterminate"
        ></mat-progress-bar>
    </div>
}

<main
    class="tw-flex tw-flex-col tw-gap-4 tw-p-4 md:tw-p-6 lg:tw-p-8 xl:tw-p-16"
>
    <!-- ページ名はヘッダー（layout header の pageTitle）だけに出し、本文に重ねない -->
    <div>
        <app-operation-route-diagram-route-filter></app-operation-route-diagram-route-filter>
    </div>
    <!-- 運用番号を選ぶ手段（検索カード）を広告より前に置く。
         運用番号が未設定のとき、「運用番号を設定して検索してください」という空状態と
         実際に設定できるコントロールの間に 280px の広告が挟まっており、
         このページ上で操作できること自体が見えなかった（audit C6）。 -->
    <div class="tw-flex tw-flex-col tw-gap-4">
        <app-operation-route-diagram-drawing-container
            (emptyStateActionClick)="onEmptyStateActionClick()"
        ></app-operation-route-diagram-drawing-container>
        <app-operation-search-card-c></app-operation-search-card-c>
    </div>
</main>
