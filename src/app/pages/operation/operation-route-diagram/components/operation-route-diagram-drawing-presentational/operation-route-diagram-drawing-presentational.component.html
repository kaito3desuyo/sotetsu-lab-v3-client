<article class="tw-bg-white tw-shadow-md">
    <header
        class="tw-flex tw-h-12 tw-flex-row tw-items-center tw-justify-start tw-px-4"
        [class]="isHolidayCalendar() ? 'holiday' : 'weekday'"
    >
        <h3 class="tw-text-base tw-font-normal tw-leading-5 tw-text-white">
            {{ calendar().startDate | date: 'yyyy年MM月dd日' }}
            改正<br />
            {{ calendar().calendarName }}
            {{ operation().operationNumber }}運
        </h3>
    </header>
    <div class="tw-flex tw-flex-col tw-gap-4 tw-p-4">
        <div class="tw-w-full tw-overflow-x-auto">
            <div class="tw-sticky tw-top-0 tw-z-10 tw-w-fit tw-bg-white">
                <svg [attr.width]="svgWidth()" [attr.height]="HEADER_HEIGHT">
                    <ng-container
                        *ngTemplateOutlet="stationHeaderTpl"
                    ></ng-container>
                    <ng-container
                        *ngTemplateOutlet="
                            boundaryTpl;
                            context: { offset: 0, height: HEADER_HEIGHT }
                        "
                    ></ng-container>
                </svg>
            </div>
            <div>
                <svg [attr.width]="svgWidth()" [attr.height]="bodyHeight()">
                    <ng-container
                        *ngTemplateOutlet="
                            gridlinesTpl;
                            context: { offset: 0, height: bodyHeight() }
                        "
                    ></ng-container>
                    <ng-container
                        *ngTemplateOutlet="
                            boundaryTpl;
                            context: { offset: 0, height: bodyHeight() }
                        "
                    ></ng-container>
                    <ng-container
                        *ngTemplateOutlet="
                            bandsTpl;
                            context: { offset: 0 }
                        "
                    ></ng-container>
                </svg>
            </div>
        </div>

        <div>
            <app-button
                variant="secondary"
                (buttonClick)="downloadAsPng()"
            >画像としてダウンロードする</app-button>
        </div>

        @if (drawingSVGForOutput()) {
            <div class="tw-hidden">
                <svg
                    style="
                        font-family: -apple-system, BlinkMacSystemFont, Roboto,
                            'Yu Gothic UI', '游ゴシック体', YuGothic,
                            'Yu Gothic Medium', sans-serif;
                    "
                    #svgElement
                    [attr.width]="svgWidth()"
                    [attr.height]="HEADER_HEIGHT + bodyHeight()"
                >
                    <ng-container
                        *ngTemplateOutlet="stationHeaderTpl"
                    ></ng-container>
                    <ng-container
                        *ngTemplateOutlet="
                            gridlinesTpl;
                            context: {
                                offset: HEADER_HEIGHT,
                                height: bodyHeight(),
                            }
                        "
                    ></ng-container>
                    <ng-container
                        *ngTemplateOutlet="
                            boundaryTpl;
                            context: {
                                offset: 0,
                                height: HEADER_HEIGHT + bodyHeight(),
                            }
                        "
                    ></ng-container>
                    <ng-container
                        *ngTemplateOutlet="
                            bandsTpl;
                            context: { offset: HEADER_HEIGHT }
                        "
                    ></ng-container>
                </svg>
            </div>
        }
    </div>
</article>

<!-- G6: 駅名ヘッダー（縦書き圧縮＝1 文字ずつ縦積み。390px フィットのため列間隔は動的） -->
<ng-template #stationHeaderTpl>
    <svg>
        @for (col of stationColumns(); track col.stationId) {
            <text
                [attr.x]="col.xList"
                y="0,0,0,0,0,0"
                dy="0,13,26,39,52,65"
                font-size="11"
                fill="#001556"
            >{{
                col.stationName
                    | operationRouteDiagramFormatStationName
                    | padding: { num: STATION_LABEL_CHARS }
            }}</text>
        }
    </svg>
</ng-template>

<!-- G6: 駅ごとの薄い縦グリッド線（判読補助） -->
<ng-template #gridlinesTpl let-offset="offset" let-height="height">
    <svg>
        @for (col of stationColumns(); track col.stationId) {
            <line
                [attr.x1]="col.x"
                [attr.x2]="col.x"
                [attr.y1]="offset"
                [attr.y2]="offset + height"
                stroke="black"
                stroke-dasharray="4 4"
                stroke-opacity="0.1"
            ></line>
        }
    </svg>
</ng-template>

<!-- G6: 路線境界の二重縦罫線（データ駆動: borderAfterStation を再利用） -->
<ng-template #boundaryTpl let-offset="offset" let-height="height">
    <svg>
        @for (x of boundaryXs(); track x) {
            <line
                [attr.x1]="x - 1.5"
                [attr.x2]="x - 1.5"
                [attr.y1]="offset"
                [attr.y2]="offset + height"
                stroke="#001556"
                stroke-width="1"
            ></line>
            <line
                [attr.x1]="x + 1.5"
                [attr.x2]="x + 1.5"
                [attr.y1]="offset"
                [attr.y2]="offset + height"
                stroke="#001556"
                stroke-width="1"
            ></line>
        }
    </svg>
</ng-template>

<!-- G6: 行路帯本体。種別×塗り言語（優等=紺塗り白字/快速等=白地種別色枠/回送=点線灰）・
     両端の発着時刻・出庫/入庫のオレンジタグ+○/△・列間の接続線を描画する。 -->
<ng-template #bandsTpl let-offset="offset">
    <svg>
        @for (row of bandRows(); track row.tripOperationListId; let i = $index) {
            <g
                class="tw-cursor-pointer"
                (click)="onClickBand(row)"
            >
                @if (row.style === 'nonRevenue') {
                    <line
                        [attr.x1]="row.leftX"
                        [attr.x2]="row.rightX"
                        [attr.y1]="row.centerY + offset"
                        [attr.y2]="row.centerY + offset"
                        stroke="#9e9e9e"
                        stroke-width="2"
                        stroke-dasharray="5 3"
                    ></line>
                } @else {
                    <!-- G6: 旅客列車は種別を問わず白地+種別色(tripClassColor)の
                         角丸枠で統一。種別の区別は枠色/文字色のみ（モック04実測）。 -->
                    <rect
                        [attr.x]="row.leftX"
                        [attr.y]="row.bandTop + offset"
                        [attr.width]="row.rightX - row.leftX"
                        [attr.height]="BAND_HEIGHT"
                        rx="6"
                        fill="#ffffff"
                        [attr.stroke]="row.color"
                        stroke-width="2"
                    ></rect>
                }

                <text
                    text-anchor="middle"
                    [attr.x]="(row.leftX + row.rightX) / 2"
                    [attr.y]="row.centerY + offset + 4"
                    font-size="10"
                    font-weight="700"
                    [attr.fill]="
                        row.style === 'nonRevenue' ? '#757575' : row.color
                    "
                >{{ row.label }}</text>

                @if (row.leftTime) {
                    <text
                        class="tw-tabular-nums"
                        text-anchor="end"
                        [attr.x]="row.leftX - 2"
                        [attr.y]="row.bandTop + offset + BAND_HEIGHT + 12"
                        font-size="10"
                        fill="black"
                    >{{
                        row.leftTime
                            | dateFns
                                : { format: 'HHmm', parseFormat: 'HH:mm:ss' }
                    }}</text>
                }
                @if (row.rightTime) {
                    <text
                        class="tw-tabular-nums"
                        text-anchor="start"
                        [attr.x]="row.rightX + 2"
                        [attr.y]="row.bandTop + offset + BAND_HEIGHT + 12"
                        font-size="10"
                        fill="black"
                    >{{
                        row.rightTime
                            | dateFns
                                : { format: 'HHmm', parseFormat: 'HH:mm:ss' }
                    }}</text>
                }

                @if (row.depotOut) {
                    <circle
                        [attr.cx]="row.depotOutX"
                        [attr.cy]="row.centerY + offset"
                        r="6"
                        stroke="#001556"
                        fill="white"
                        stroke-width="2"
                    ></circle>
                    <rect
                        [attr.x]="row.depotOutX - 17"
                        [attr.y]="row.bandTop + offset - 16"
                        width="34"
                        height="14"
                        rx="3"
                        fill="#ee7b35"
                    ></rect>
                    <text
                        text-anchor="middle"
                        [attr.x]="row.depotOutX"
                        [attr.y]="row.bandTop + offset - 6"
                        font-size="9"
                        fill="white"
                    >出庫</text>
                }
                @if (row.depotIn) {
                    <polygon
                        [attr.points]="
                            (row.depotInX - 6) +
                            ',' + (row.centerY + offset - 5) + ' ' +
                            (row.depotInX + 6) +
                            ',' + (row.centerY + offset - 5) + ' ' +
                            row.depotInX +
                            ',' + (row.centerY + offset + 6)
                        "
                        stroke="#001556"
                        fill="white"
                        stroke-width="2"
                    ></polygon>
                    <rect
                        [attr.x]="row.depotInX - 17"
                        [attr.y]="row.bandTop + offset - 16"
                        width="34"
                        height="14"
                        rx="3"
                        fill="#ee7b35"
                    ></rect>
                    <text
                        text-anchor="middle"
                        [attr.x]="row.depotInX"
                        [attr.y]="row.bandTop + offset - 6"
                        font-size="9"
                        fill="white"
                    >入庫</text>
                }

                @if (!row.depotIn && bandRows()[i + 1]) {
                    <line
                        [attr.x1]="row.depotInX"
                        [attr.x2]="row.depotInX"
                        [attr.y1]="row.centerY + offset"
                        [attr.y2]="bandRows()[i + 1].centerY + offset"
                        stroke="black"
                        stroke-width="1"
                    ></line>
                }
            </g>
        }
    </svg>
</ng-template>
