<article class="tw-overflow-clip tw-rounded-card tw-bg-white">
    <header
        class="tw-flex tw-h-12 tw-flex-row tw-items-center tw-justify-start tw-px-4"
        [class]="isHolidayCalendar() ? 'holiday' : 'weekday'"
    >
        <h3 class="tw-text-base tw-font-normal tw-leading-5 tw-text-white">
            {{ calendar().startDate | date: 'yyyy年MM月dd日' }}
            改正<br />
            {{ calendar().calendarName }}
            {{ operation().operationNumber }}運
        </h3>
    </header>
    <!-- 図はカードの幅いっぱいに広げる。駅が多く列間隔が下限を割るときだけ横にはみ出すので、
         縦もカード内でスクロールさせ（過去の運用情報と同じ）、横スクロールバーが
         図の底（列車が多いと 1,000px 下）に隠れないようにする。駅名は上に貼り付ける。 -->
    <div
        #scroller
        class="tw-max-h-[calc(100dvh-80px)] tw-overflow-auto md:tw-max-h-[calc(100dvh-96px)]"
    >
        <div class="tw-sticky tw-top-0 tw-z-10 tw-w-fit tw-bg-white">
            <svg [attr.width]="svgWidth()" [attr.height]="HEADER_HEIGHT">
                <ng-container
                    *ngTemplateOutlet="
                        stationHeaderTpl;
                        context: { columns: stationColumns() }
                    "
                ></ng-container>
            </svg>
        </div>
        <svg
            class="tw-block"
            [attr.width]="svgWidth()"
            [attr.height]="bodyHeight()"
        >
            <ng-container
                *ngTemplateOutlet="
                    gridlinesTpl;
                    context: {
                        columns: stationColumns(),
                        offset: 0,
                        height: bodyHeight(),
                    }
                "
            ></ng-container>
            <ng-container
                *ngTemplateOutlet="
                    bandsTpl;
                    context: { rows: bandRows(), offset: 0 }
                "
            ></ng-container>
        </svg>
    </div>

    <div class="tw-p-4">
        <app-button variant="secondary" (buttonClick)="downloadAsPng()"
            >画像としてダウンロードする</app-button
        >
    </div>

    <!-- 画像出力はカードの幅に左右されない固定の列間隔で描く（outputColumnMetrics） -->
    @if (drawingSVGForOutput()) {
        <div class="tw-hidden">
            <svg
                style="
                    font-family: -apple-system, BlinkMacSystemFont, Roboto,
                        'Yu Gothic UI', '游ゴシック体', YuGothic,
                        'Yu Gothic Medium', sans-serif;
                "
                #svgElement
                [attr.width]="outputColumnMetrics().width"
                [attr.height]="HEADER_HEIGHT + bodyHeight()"
            >
                <ng-container
                    *ngTemplateOutlet="
                        stationHeaderTpl;
                        context: { columns: outputStationColumns() }
                    "
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        gridlinesTpl;
                        context: {
                            columns: outputStationColumns(),
                            offset: HEADER_HEIGHT,
                            height: bodyHeight(),
                        }
                    "
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        bandsTpl;
                        context: { rows: outputBandRows(), offset: HEADER_HEIGHT }
                    "
                ></ng-container>
            </svg>
        </div>
    }
</article>

<!-- 駅名（1 文字ずつ縦に積む） -->
<ng-template #stationHeaderTpl let-columns="columns">
    <svg>
        @for (col of columns; track col.stationId) {
            <text
                [attr.x]="col.xList"
                [attr.y]="stationYList"
                font-size="13"
                fill="#212121"
                text-anchor="middle"
            >{{
                col.stationName
                    | operationRouteDiagramFormatStationName
                    | padding: { num: STATION_LABEL_CHARS }
            }}</text>
        }
    </svg>
</ng-template>

<!-- 駅ごとの薄い縦の点線 -->
<ng-template
    #gridlinesTpl
    let-columns="columns"
    let-offset="offset"
    let-height="height"
>
    <svg>
        @for (col of columns; track col.stationId) {
            <line
                [attr.x1]="col.x"
                [attr.x2]="col.x"
                [attr.y1]="offset"
                [attr.y2]="offset + height"
                stroke="black"
                stroke-dasharray="4 4"
                stroke-opacity="0.1"
            ></line>
        }
    </svg>
</ng-template>

<!-- 列車（本番の行路図と同じ骨格）: 横線（旅客=種別色の実線・回送=灰の点線）、
     両端の時刻は線の外側、種別チップ＋列番は線の上の中央、出庫○・入庫△は端、
     着いた端から次の列車の線まで縦線。押すと全線時刻表へ移る。 -->
<ng-template #bandsTpl let-rows="rows" let-offset="offset">
    <svg>
        @for (row of rows; track row.tripOperationListId) {
            <g class="tw-cursor-pointer" (click)="onClickBand(row)">
                <line
                    [attr.x1]="row.leftX"
                    [attr.x2]="row.rightX"
                    [attr.y1]="row.centerY + offset"
                    [attr.y2]="row.centerY + offset"
                    [attr.stroke]="row.color"
                    stroke-width="2"
                    [attr.stroke-dasharray]="
                        row.style === 'nonRevenue' ? '5 3' : null
                    "
                ></line>

                <!-- 種別チップ（app-trip-class-chip と同じ白字＋黒の縁取り） -->
                <rect
                    [attr.x]="row.chipX"
                    [attr.y]="row.chipY + offset"
                    [attr.width]="row.chipWidth"
                    [attr.height]="CHIP_HEIGHT"
                    [attr.rx]="CHIP_RADIUS"
                    [attr.fill]="row.chipFill"
                ></rect>
                <text
                    dominant-baseline="central"
                    [attr.x]="row.chipTextX"
                    [attr.y]="row.labelY + offset"
                    [attr.font-size]="CHIP_FONT_SIZE"
                    font-weight="700"
                    fill="white"
                    stroke="black"
                    stroke-width="0.96"
                    paint-order="stroke fill"
                >{{ row.tripClassName }}</text>
                <!-- 和文と数字で central の解釈が違い、数字が下にずれて見えるので 0.5 上げる（99 文書追補 14） -->
                <text
                    class="tw-tabular-nums"
                    dominant-baseline="central"
                    dy="0.5"
                    [attr.x]="row.tripNumberX"
                    [attr.y]="row.labelY + offset"
                    [attr.font-size]="TRIP_NUMBER_FONT_SIZE"
                    fill="#212121"
                >{{ row.tripNumber }}</text>

                @if (row.leftTime) {
                    <text
                        class="tw-tabular-nums"
                        text-anchor="end"
                        dominant-baseline="central"
                        [attr.x]="row.leftTimeX"
                        [attr.y]="row.centerY + offset"
                        [attr.font-size]="TIME_FONT_SIZE"
                        fill="#212121"
                    >{{
                        row.leftTime
                            | dateFns: { format: 'HHmm', parseFormat: 'HH:mm:ss' }
                    }}</text>
                }
                @if (row.rightTime) {
                    <text
                        class="tw-tabular-nums"
                        text-anchor="start"
                        dominant-baseline="central"
                        [attr.x]="row.rightTimeX"
                        [attr.y]="row.centerY + offset"
                        [attr.font-size]="TIME_FONT_SIZE"
                        fill="#212121"
                    >{{
                        row.rightTime
                            | dateFns: { format: 'HHmm', parseFormat: 'HH:mm:ss' }
                    }}</text>
                }

                <!-- 出庫: 白抜きの○ -->
                @if (row.depotOut) {
                    <circle
                        [attr.cx]="row.depotOutX"
                        [attr.cy]="row.centerY + offset"
                        r="6"
                        stroke="#001556"
                        fill="white"
                        stroke-width="2"
                    ></circle>
                }
                <!-- 入庫: 白抜きの上向き△。外接する箱の中心を線の位置と端の駅に合わせる -->
                @if (row.depotIn) {
                    <polygon
                        [attr.points]="
                            row.depotInX +
                            ',' +
                            (row.centerY + offset - 6.5) +
                            ' ' +
                            (row.depotInX - 7.5) +
                            ',' +
                            (row.centerY + offset + 6.5) +
                            ' ' +
                            (row.depotInX + 7.5) +
                            ',' +
                            (row.centerY + offset + 6.5)
                        "
                        stroke="black"
                        fill="white"
                        stroke-width="2"
                    ></polygon>
                }

                <!-- 次の列車への縦線。色は接続元の種別色から接続先の種別色へ移るグラデーション。
                     幅 0 の直線は objectBoundingBox だと塗られない（画像出力で消えた）ので
                     userSpaceOnUse にし、座標は実座標で与える。 -->
                @if (row.connectorX !== undefined) {
                    <defs>
                        <linearGradient
                            [attr.id]="row.connectorGradientId"
                            gradientUnits="userSpaceOnUse"
                            [attr.x1]="row.connectorX"
                            [attr.y1]="row.connectorY1! + offset"
                            [attr.x2]="row.connectorX"
                            [attr.y2]="row.connectorY2! + offset"
                        >
                            <stop offset="0%" [attr.stop-color]="row.color"></stop>
                            <stop
                                offset="100%"
                                [attr.stop-color]="row.connectorEndColor"
                            ></stop>
                        </linearGradient>
                    </defs>
                    <path
                        [attr.d]="
                            'M ' +
                            row.connectorX +
                            ' ' +
                            (row.connectorY1! + offset) +
                            ' L ' +
                            row.connectorX +
                            ' ' +
                            (row.connectorY2! + offset)
                        "
                        [attr.stroke]="'url(#' + row.connectorGradientId + ')'"
                        stroke-width="2"
                        fill="none"
                    ></path>
                }
            </g>
        }
    </svg>
</ng-template>
