<div>
    @if (drawingDisplayed()) {
        <app-operation-route-diagram-drawing-presentational
            [stations]="stations()"
            [tripOperationLists]="tripOperationLists()"
            [calendar]="calendar()"
            [operation]="operation()"
            (clickNavigateTimetable)="onReceiveClickNavigateTimetable($event)"
        ></app-operation-route-diagram-drawing-presentational>
    } @else {
        <!-- G12: mockup-07 準拠の3点セット（アイコン+説明+次アクション）。 -->
        <app-empty-state
            icon="route"
            message="運用番号を設定して検索してください"
            actionLabel="運用表を見る"
            (actionClick)="emptyStateActionClick.emit()"
        ></app-empty-state>
    }
</div>
