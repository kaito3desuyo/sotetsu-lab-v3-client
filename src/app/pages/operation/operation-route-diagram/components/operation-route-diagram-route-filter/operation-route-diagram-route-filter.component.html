<!-- 運用番号が未設定のあいだ routeOptions は空になる。ラベルだけが対応する
     コントロール無しで宙に浮いていたため、チップが 1 つも無い間は帯ごと出さない
     （audit C6）。取る前も操作帯を出して高さを取る（以前はチップが届くまで帯ごと無く、
     届くと図を 146px 押し下げていた・2026-10-22）。帯は 1 つにして、取り直しで畳んだ状態などが
     消えないようにする。操作部はページ上端の全幅の白帯に載せる（列車ダイヤグラムと同じ・2026-10-05） -->
@if (
    alwaysVisible() || isAwaitingOperationTrips() || routeOptions().length > 0
) {
    <app-control-band
        collapse="box"
        [summary]="summary()"
        [filterActive]="!isAwaitingOperationTrips() && filterActive()"
    >
        <ng-content select="[bandLead]"></ng-content>
        @if (isAwaitingOperationTrips() || routeOptions().length > 0) {
            <p class="tw-m-0 tw-mb-2 tw-text-xs tw-text-grey-600">
                路線で絞り込み
            </p>
            @if (isAwaitingOperationTrips()) {
                <app-skeleton-chips
                    [widths]="routeSkeletonWidths"
                ></app-skeleton-chips>
            } @else {
                <app-filter-chips
                    mode="multiple"
                    [scrollMode]="true"
                    [options]="routeOptions()"
                    [selected]="selectedRouteIds()"
                    (selectedChange)="onChange($event)"
                ></app-filter-chips>
            }
        }
    </app-control-band>
}
