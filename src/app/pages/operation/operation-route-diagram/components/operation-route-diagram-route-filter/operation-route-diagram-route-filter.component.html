<!-- 運用番号が未設定のあいだ routeOptions は空になる。ラベルだけが対応する
     コントロール無しで宙に浮いていたため、チップが 1 つも無い間は帯ごと出さない
     （audit C6）。 -->
@if (routeOptions().length > 0) {
    <div>
        <p class="tw-m-0 tw-mb-1 tw-text-xs tw-text-grey-600">
            路線で駅を絞り込み（経由しない路線は選択不可）
        </p>
        <app-filter-chips
            mode="multiple"
            [scrollMode]="true"
            [options]="routeOptions()"
            [selected]="selectedRouteIds()"
            (selectedChange)="onChange($event)"
        ></app-filter-chips>
    </div>
}
