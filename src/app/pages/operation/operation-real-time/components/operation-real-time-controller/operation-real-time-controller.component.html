<!-- mockup-02 / 98 §G2: トグル3個（自動更新/履歴/現在位置）を1行にコンパクト配置。
     右端の再読み込みボタンは情報削減禁止で維持 -->
<div class="tw-flex tw-flex-row tw-flex-wrap tw-items-center tw-gap-x-2 tw-gap-y-1 sm:tw-gap-x-4">
    <mat-slide-toggle
        color="accent"
        [checked]="isEnableAutoReload()"
        (change)="toggleAutoReload($event.checked)"
    >
        自動更新
    </mat-slide-toggle>
    <mat-slide-toggle
        color="accent"
        [checked]="isVisibleSightingHistories()"
        (change)="toggleVisibleSightingHistories($event.checked)"
    >
        履歴
    </mat-slide-toggle>
    <mat-slide-toggle
        color="accent"
        [checked]="isVisibleCurrentPosition()"
        (change)="toggleVisibleCurrentPosition($event.checked)"
    >
        現在位置
    </mat-slide-toggle>
    <span class="tw-flex-1"></span>
    <button
        mat-icon-button
        color="accent"
        aria-label="目撃情報を再読み込み"
        (click)="reload()"
    >
        <mat-icon>refresh</mat-icon>
    </button>
</div>
