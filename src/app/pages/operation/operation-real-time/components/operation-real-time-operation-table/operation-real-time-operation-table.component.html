@if (filteredOperations().length === 0) {
    <app-empty-state
        icon="filter_alt_off"
        message="条件に一致する運用がありません"
    ></app-empty-state>
} @else {
    <!-- 帳票: 1 枚の白地を罫線で区切る（docs/design.md 面の掟の例外・2026-10-06）。
         各行に右と下の罫線を引き、grid の負のマージン 1px で一番下の段の下線と
         右端の列の右線を白地の外へ出して切り落とす。件数が奇数でも欠けない -->
    <div class="tw-overflow-hidden tw-rounded-card tw-bg-white">
        <div
            class="-tw-mb-px -tw-mr-px tw-grid tw-grid-cols-1 lg:tw-grid-cols-2"
        >
            @for (
                operation of filteredOperations();
                track operation.operationId
            ) {
                <app-operation-real-time-operation-card
                    class="tw-border-0 tw-border-b tw-border-r tw-border-solid tw-border-rule"
                    [operation]="operation"
                    [timeCrossSection]="
                        queryTimeCrossSectionByOperationNumber(
                            operation.operationNumber
                        )()
                    "
                    [histories]="
                        queryHistoriesByOperationNumber(
                            operation.operationNumber
                        )()
                    "
                    [currentPosition]="
                        queryCurrentPositionByOperationNumber(
                            operation.operationNumber
                        )()
                    "
                    [formations]="formations() ?? []"
                    [agencies]="agencies()"
                    [stations]="stations() ?? []"
                    [tripClasses]="tripClasses() ?? []"
                    [calendarId]="calendar()?.calendarId"
                    [isVisibleSightingHistories]="isVisibleSightingHistories()"
                    [isVisibleCurrentPosition]="isVisibleCurrentPosition()"
                    [isSightingLoading]="isLoading()"
                ></app-operation-real-time-operation-card>
            }
        </div>
    </div>
}
