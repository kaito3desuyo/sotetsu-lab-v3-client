<div class="tw-flex tw-flex-col tw-gap-2">
    <p class="tw-m-0 tw-text-xs tw-text-grey-600">絞り込み</p>
    <!-- 会社と運用群は段を分ける（ユーザー指示 2026-08-22）。
         1 行に混在させると、どちらの軸で絞っているのか読み取りにくく、
         横スクロールでどちらかが見切れる。
         選択肢は会社が編成から、運用群が運用から作られる。取る前はチップの形の骨組みを出し
         （運用群の「休」だけが先に出ないように）、1 行分（42px）の高さも保つ。
         後から伸びると下の一覧がずれて CLS になる（2026-10-21） -->
    @if (hasFetchedFormations()) {
        <app-filter-chips
            class="tw-min-h-[42px]"
            mode="multiple"
            [scrollMode]="true"
            [options]="agencyOptions()"
            [selected]="selectedAgencyIds()"
            (selectedChange)="onAgencyChange($event)"
        ></app-filter-chips>
    } @else {
        <ng-container
            *ngTemplateOutlet="
                chipsSkeleton;
                context: { widths: agencySkeletonWidths }
            "
        ></ng-container>
    }
    @if (hasFetchedOperations()) {
        <app-filter-chips
            class="tw-min-h-[42px]"
            mode="multiple"
            [scrollMode]="true"
            [options]="groupOptions()"
            [selected]="selectedGroupNames()"
            (selectedChange)="onGroupChange($event)"
        ></app-filter-chips>
    } @else {
        <ng-container
            *ngTemplateOutlet="
                chipsSkeleton;
                context: { widths: groupSkeletonWidths }
            "
        ></ng-container>
    }
</div>

<!-- 作りはダッシュボードの最新の目撃情報の骨組みと同じ。チップの高さは 32px -->
<ng-template #chipsSkeleton let-widths="widths">
    <div
        class="tw-flex tw-h-[42px] tw-flex-row tw-items-center tw-gap-2 tw-overflow-hidden"
        aria-label="読み込み中"
        data-testid="filter-chips-skeleton"
    >
        @for (width of widths; track $index) {
            <span
                class="tw-block tw-h-8 tw-shrink-0 tw-animate-pulse tw-rounded-control tw-bg-paper-3 motion-reduce:tw-animate-none"
                [class]="width"
            ></span>
        }
    </div>
</ng-template>
