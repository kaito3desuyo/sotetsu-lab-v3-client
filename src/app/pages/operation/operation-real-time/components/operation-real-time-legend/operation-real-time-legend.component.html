<article
    class="tw-box-border tw-flex tw-h-full tw-w-full tw-flex-col tw-gap-4 tw-rounded-card tw-bg-white tw-p-4"
>
    <header>
        <h2 class="tw-m-0 tw-text-2xl tw-font-normal">凡例</h2>
    </header>
    <div class="tw-flex-grow">
        <dl class="tw-m-0 tw-flex tw-flex-col tw-gap-1 tw-text-sm">
            <div class="tw-flex tw-flex-row tw-gap-4">
                <dt
                    class="tw-flex-none tw-basis-12 tw-whitespace-nowrap"
                    style="font-weight: 700"
                >
                    太字
                </dt>
                <dd class="tw-ml-0">本日中に目撃された情報</dd>
            </div>
            <div class="tw-flex tw-flex-row tw-gap-4">
                <dt
                    class="tw-flex-none tw-basis-12 tw-whitespace-nowrap"
                    style="text-decoration: underline"
                >
                    下線
                </dt>
                <dd class="tw-ml-0">昨日に目撃された情報</dd>
            </div>
            <div class="tw-flex tw-flex-row tw-gap-4">
                <dt
                    class="tw-flex-none tw-basis-12 tw-whitespace-nowrap tw-text-recency-today"
                >
                    赤字
                </dt>
                <dd class="tw-ml-0">本日中に目撃・更新された情報</dd>
            </div>
            <div class="tw-flex tw-flex-row tw-gap-4">
                <dt
                    class="tw-flex-none tw-basis-12 tw-whitespace-nowrap tw-text-recency-yesterday"
                >
                    緑字
                </dt>
                <dd class="tw-ml-0">昨日に目撃・更新された情報</dd>
            </div>
            <div class="tw-flex tw-flex-row tw-gap-4">
                <dt class="tw-flex-none tw-basis-12 tw-whitespace-nowrap">
                    〇〇?
                </dt>
                <dd class="tw-ml-0">
                    順送り済み情報の推測される編成・運用番号
                </dd>
            </div>
            <!-- 「休」/ ○ / △ / ? の 4 行は削除した（ユーザー判断 2026-08-22）。
                 いずれも画面上で「出庫前○」「入庫済△」のように記号と語がセットで
                 出ており、凡例を見なくても意味が取れる。
                 残す 5 行は書体・色・記号だけで示していて語の併記が無いもの。 -->
        </dl>
    </div>
</article>
