<!-- 枠線は選択・未選択とも 1px で色だけ変える（色の掟 5。未選択にだけ付けると選択時に高さが縮む）。
     preflight が無いので、字をアプリの字にそろえないとブラウザ既定のボタンの字になる -->
<button
    type="button"
    class="tw-box-border tw-inline-flex tw-h-8 tw-cursor-pointer tw-items-center tw-gap-1 tw-rounded-full tw-border tw-border-solid tw-px-3 tw-font-[inherit] tw-text-sm tw-font-bold"
    [class.tw-border-accent-500]="active()"
    [class.tw-bg-accent-500]="active()"
    [class.tw-text-accent-ink]="active()"
    [class.tw-border-rule-strong]="!active()"
    [class.tw-bg-white]="!active()"
    [class.tw-text-ink]="!active()"
    [attr.aria-pressed]="active()"
    (click)="toggled.emit()"
>
    目撃募集 {{ count() }} {{ active() ? '✕' : '›' }}
</button>
