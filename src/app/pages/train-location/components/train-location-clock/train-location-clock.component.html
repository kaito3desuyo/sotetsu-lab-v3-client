<div
    class="tw-flex tw-flex-col tw-items-center tw-gap-1 tw-border-b tw-border-grey-200 tw-bg-white tw-px-3 tw-py-3"
>
    <div class="tw-font-mono tw-text-3xl tw-tabular-nums tw-tracking-wide">
        {{ clockText() }}
    </div>
    <div class="tw-text-xs tw-text-grey-600">{{ description() }}</div>

    @if (mode() === 'specified') {
        <mat-form-field subscriptSizing="dynamic" class="tw-mt-1 tw-w-40">
            <mat-label>表示時刻</mat-label>
            <input
                matInput
                type="time"
                aria-label="表示時刻を指定する"
                class="tw-font-mono tw-tabular-nums"
                [ngModel]="timeInputValue()"
                (ngModelChange)="onTimeInputChange($event)"
            />
        </mat-form-field>
    }
</div>
