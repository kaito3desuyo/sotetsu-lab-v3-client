<!-- 図そのものが本文なので外周 gutter は持たない（docs/design.md「余白の掟」2）。
     図の上下の chrome は横 12px の inset。landmark は揃える。 -->
<main class="tw-flex tw-h-full tw-flex-col tw-bg-paper-2">
    <!-- 読み込み中はプログレスバーだけ（ロック済みページと同じ。位置は運用表と同じヘッダーのすぐ下） -->
    @if (isLoading()) {
        <div
            class="tw-fixed tw-left-0 tw-top-[48px] tw-z-[60] tw-w-full md:tw-top-[64px]"
        >
            <mat-progress-bar
                color="accent"
                mode="indeterminate"
            ></mat-progress-bar>
        </div>
    }

    <app-control-band [flush]="true" [summary]="bandSummary()">
        <app-train-location-controller
            [calendarId]="calendarId()"
            [selectedRouteId]="selectedRouteId()"
            [mode]="mode()"
            [clockText]="clockText()"
            [timeInputValue]="timeInputValue()"
            (calendarIdChange)="onCalendarIdChange($event)"
            (routeIdChange)="onRouteIdChange($event)"
            (modeChange)="onModeChange($event)"
            (timeInputValueChange)="onTimeInputValueChange($event)"
        ></app-train-location-controller>
    </app-control-band>

    <div class="tw-flex-1 tw-overflow-y-auto tw-px-3 tw-py-3">
        @if (!hasFetchedTrainLocation()) {
            <!-- 取る前は本物と同じ格子で、駅のパネル（45px）と路線図のカード（画面 1 枚分）の骨組みを出す。
                 以前は本文が空でフッターが見えていて、届くと押し出されていた（CLS 0.13・2026-10-22）。
                 isLoading() で本文を消すのもやめた -->
            <div
                class="tw-grid tw-grid-cols-1 tw-gap-3 lg:tw-grid-cols-[40rem_minmax(0,1fr)] lg:tw-items-start"
                aria-label="読み込み中"
                data-testid="train-location-skeleton"
            >
                <app-skeleton-bar
                    class="tw-h-[45px] tw-w-full !tw-rounded-card lg:tw-col-start-2 lg:tw-row-start-1"
                ></app-skeleton-bar>
                <div
                    class="tw-flex tw-h-[calc(100dvh-48px)] tw-flex-col tw-gap-6 tw-overflow-hidden tw-rounded-card tw-bg-white tw-p-4 md:tw-h-[calc(100dvh-64px)] lg:tw-col-start-1 lg:tw-row-start-1"
                >
                    @for (row of skeletonStationRows; track row) {
                        <div
                            class="tw-flex tw-shrink-0 tw-flex-row tw-items-center tw-gap-4"
                        >
                            <app-skeleton-bar
                                class="tw-h-4 tw-w-4 tw-shrink-0 tw-rounded-full"
                            ></app-skeleton-bar>
                            <app-skeleton-bar
                                class="tw-h-5 tw-w-24 tw-shrink-0"
                            ></app-skeleton-bar>
                            <app-skeleton-bar
                                class="tw-h-8 tw-w-28 tw-shrink-0"
                            ></app-skeleton-bar>
                        </div>
                    }
                </div>
            </div>
        } @else {
            <div
                class="tw-grid tw-grid-cols-1 tw-gap-3 lg:tw-grid-cols-[40rem_minmax(0,1fr)] lg:tw-items-start"
            >
                <app-train-location-station-panel
                    class="lg:tw-sticky lg:tw-top-0 lg:tw-col-start-2 lg:tw-row-start-1"
                    [stationId]="selectedStationId()"
                    [stationName]="selectedStationName()"
                    [interchangeRoutes]="selectedStationInterchangeRoutes()"
                    [arrivals]="arrivals()"
                ></app-train-location-station-panel>

                <div
                    class="tw-rounded-card tw-bg-white lg:tw-col-start-1 lg:tw-row-start-1"
                >
                    @if (hasNoTrainsInService()) {
                        <app-empty-state
                            icon="train"
                            message="現在この路線を走行中の列車はありません"
                            [subtitle]="emptyStateSubtitle()"
                            [actionLabel]="emptyStateActionLabel()"
                            (actionClick)="onEmptyStateAction()"
                        ></app-empty-state>
                    }
                    <app-train-location-line
                        [rows]="rows()"
                        [selectedStationId]="selectedStationId()"
                        (stationSelect)="onStationSelect($event)"
                    ></app-train-location-line>
                </div>
            </div>
        }
    </div>

    <!-- 免責文（98 G8: 最下部固定で常設）。ページ内でこの 1 か所だけ。 -->
    <footer
        class="tw-shrink-0 tw-border-0 tw-border-t tw-border-solid tw-border-rule tw-bg-white tw-px-3 tw-py-2 tw-text-center tw-text-xs tw-text-muted"
    >
        ダイヤ通りに走った場合の位置です。実在線は
        <a
            routerLink="/operation/real-time"
            class="tw-text-structure tw-underline"
            >リアルタイム運用情報</a
        >へ。
    </footer>
</main>
