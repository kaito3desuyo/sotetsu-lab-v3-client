<!-- 図そのものが本文なので外周 gutter は持たない（他ページの main とは
     意図的に異なる。docs/design.md「余白の掟」参照）。ただし landmark は揃える。 -->
<main class="tw-flex tw-h-full tw-flex-col">
    @if (isLoading()) {
        <mat-progress-bar
            mode="indeterminate"
            class="tw-fixed tw-inset-x-0 tw-top-0 tw-z-30"
        ></mat-progress-bar>
    }

    <app-train-location-controller
        [calendarId]="calendarId()"
        [selectedRouteId]="selectedRouteId()"
        [mode]="mode()"
        (calendarIdChange)="onCalendarIdChange($event)"
        (routeIdChange)="onRouteIdChange($event)"
        (modeChange)="onModeChange($event)"
    ></app-train-location-controller>

    <app-train-location-clock
        [mode]="mode()"
        [clockText]="clockText()"
        [timeInputValue]="timeInputValue()"
        (timeInputValueChange)="onTimeInputValueChange($event)"
    ></app-train-location-clock>

    <div class="tw-flex-1 tw-overflow-y-auto tw-p-3 max-sm:tw-px-1">
        <!-- trip-blocks バルク取得（数 MB）中は駅軸が白紙に見えるため、
             ロード完了まで本文を出さず中央スピナーを表示する（20-design-ui.md §4） -->
        @if (isLoading()) {
            <div class="tw-flex tw-justify-center tw-py-16">
                <app-loading></app-loading>
            </div>
        } @else {
            <!-- G12: 在線列車が0本でも駅ライン（方位を示す有用なコンテンツ）は
                 残したまま、空文脈を知らせるメッセージを上に重ねる（情報削減禁止）。
                 操作部（コントローラ/時計）は常に操作可能（C1 準拠）。 -->
            @if (hasNoTrainsInService()) {
                <app-empty-state
                    icon="train"
                    message="現在この路線を走行中の列車はありません"
                    [subtitle]="emptyStateSubtitle()"
                    [actionLabel]="emptyStateActionLabel()"
                    (actionClick)="onEmptyStateAction()"
                ></app-empty-state>
            }
            <app-train-location-line [rows]="rows()"></app-train-location-line>
        }
    </div>

    <!-- 免責文（N2 受け入れ条件・98 G8: 最下部固定で常設。文言は R-7 短縮版）。
         操作部（collapsible-panel）内の免責はモバイルで折り畳まれると視界から
         消えるため、折り畳み・ロード状態に依存しないページ最下部で常時表示する。 -->
    <footer
        class="tw-shrink-0 tw-border-0 tw-border-t tw-border-solid tw-border-grey-200 tw-bg-grey-50 tw-px-3 tw-py-2 tw-text-center tw-text-xs tw-text-grey-600"
    >
        ダイヤ通りに走った場合の位置です。実在線は
        <a
            routerLink="/operation/real-time"
            class="tw-text-primary-500 tw-underline"
            >リアルタイム運用情報</a
        >へ。
    </footer>
</main>
