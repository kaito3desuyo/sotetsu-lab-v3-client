<div class="tw-flex tw-h-full tw-flex-col">
    @if (isLoading()) {
        <mat-progress-bar
            mode="indeterminate"
            class="tw-fixed tw-inset-x-0 tw-top-0 tw-z-30"
        ></mat-progress-bar>
    }

    <app-train-location-controller
        [calendarId]="calendarId()"
        [selectedRouteId]="selectedRouteId()"
        [mode]="mode()"
        (calendarIdChange)="onCalendarIdChange($event)"
        (routeIdChange)="onRouteIdChange($event)"
        (modeChange)="onModeChange($event)"
    ></app-train-location-controller>

    <app-train-location-clock
        [mode]="mode()"
        [clockText]="clockText()"
        [timeInputValue]="timeInputValue()"
        (timeInputValueChange)="onTimeInputValueChange($event)"
    ></app-train-location-clock>

    <div class="tw-flex-1 tw-overflow-y-auto tw-p-3 max-sm:tw-px-1">
        <!-- trip-blocks バルク取得（数 MB）中は駅軸が白紙に見えるため、
             ロード完了まで本文を出さず中央スピナーを表示する（20-design-ui.md §4） -->
        @if (isLoading()) {
            <div class="tw-flex tw-justify-center tw-py-16">
                <app-loading></app-loading>
            </div>
        } @else {
            <app-train-location-line [rows]="rows()"></app-train-location-line>
        }
    </div>
</div>
