<div class="tw-px-1 tw-pb-2 tw-pt-1">
    <h2 class="tw-m-0 tw-mb-2 tw-text-lg tw-font-bold tw-text-ink">
        {{ heading }}
    </h2>
    @for (line of lines; track $index) {
        <p class="tw-m-0 tw-mb-1 tw-text-sm tw-text-ink-2" data-help-line>
            {{ line }}
        </p>
    }
    <div class="tw-mt-3 tw-flex tw-gap-2">
        <a
            mat-stroked-button
            class="app-button app-button-secondary"
            routerLink="/guide"
            (click)="onLinkClick('/guide')"
            >使い方 ›</a
        >
        <a
            mat-stroked-button
            class="app-button app-button-secondary"
            routerLink="/glossary"
            (click)="onLinkClick('/glossary')"
            >用語集 ›</a
        >
    </div>
</div>
