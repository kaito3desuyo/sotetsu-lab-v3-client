<app-header
    class="tw-sticky tw-top-0 tw-z-30 tw-block tw-shadow-md"
    [pageTitle]="pageTitle()"
    (clickButton)="toggle()"
></app-header>

<!-- 高さはトップバーの余白込みで画面に収める（border-box）。content-box だと余白の分だけ下にはみ出し、
     最後の項目までスクロールできなかった。dvh はスマホのアドレスバーを除いた高さ -->
<app-sidenav
    class="tw-fixed tw-top-0 tw-z-20 tw-box-border tw-block tw-h-dvh tw-w-64 tw-pt-12 tw-shadow-md md:tw-pt-16"
    [@.disabled]="prefersReducedMotion"
    [@openClose]="isOpen() ? 'open' : 'close'"
>
</app-sidenav>

@if (isVisibled()) {
    <div
        class="tw-fixed tw-top-0 tw-z-10 tw-h-screen tw-w-screen"
        [@.disabled]="prefersReducedMotion"
        [@openClose]="isOpen() ? 'shadow' : 'clear'"
        (click)="toggle()"
    ></div>
}

<div class="tw-relative tw-z-0 tw-h-full tw-w-full">
    <router-outlet></router-outlet>
</div>
