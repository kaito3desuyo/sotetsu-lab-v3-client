<app-panel-card heading="時刻表を投稿する">
    <!-- 入力欄は他カードと同じ outline、上り/下りは時刻表検索と同じセグメント切替に
         そろえる（以前は fill の入力欄とラジオボタンで、このカードだけ語彙が違った） -->
    <form class="tw-flex tw-flex-col tw-gap-4" [formGroup]="form">
        <mat-form-field>
            <mat-label>ダイヤ</mat-label>
            <mat-select formControlName="calendarId">
                @for (calendar of calendars(); track calendar.calendarId) {
                    <mat-option [value]="calendar.calendarId">
                        {{
                            calendar.startDate
                                | dateFns
                                    : {
                                          format: 'yyyy/M/d改正',
                                          parseFormat: 'yyyy-MM-dd',
                                      }
                        }}
                        {{ calendar.calendarName }}
                    </mat-option>
                }
            </mat-select>
            @if (form.get('calendarId').hasError('required')) {
                <mat-error> <strong>必須項目</strong>です </mat-error>
            }
        </mat-form-field>

        <app-segment-toggle
            [options]="tripDirectionOptions"
            [value]="tripDirection()"
            (valueChange)="onTripDirectionChange($event)"
        ></app-segment-toggle>
    </form>
    <footer class="tw-flex tw-flex-col">
        <app-button
            variant="primary"
            [disabled]="form.invalid"
            (buttonClick)="clickMoveTimetableAdd.emit(form.value)"
        >
            列車情報入力へ移る
        </app-button>
    </footer>
</app-panel-card>
