<div
    class="tw-flex tw-flex-row tw-flex-wrap tw-items-center tw-justify-between tw-gap-2"
>
    <div class="tw-flex tw-flex-row tw-flex-wrap tw-gap-2">
        @for (target of prev(); track target.id) {
            <button
                mat-stroked-button
                type="button"
                (click)="step.emit(target)"
            >
                <mat-icon>chevron_left</mat-icon>
                {{ target.label }}
            </button>
        }
    </div>
    <div
        class="tw-ml-auto tw-flex tw-flex-row tw-flex-wrap tw-justify-end tw-gap-2"
    >
        @for (target of next(); track target.id) {
            <button
                mat-stroked-button
                type="button"
                (click)="step.emit(target)"
            >
                {{ target.label }}
                <mat-icon iconPositionEnd>chevron_right</mat-icon>
            </button>
        }
    </div>
</div>
